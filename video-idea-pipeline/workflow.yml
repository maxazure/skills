workflow:
  name: video-idea-pipeline
  version: "0.1.0"
  goal: "把模糊创意自动变成可执行内容 Brief"
  description: >
    接收用户的一句模糊内容想法，通过 5 个 AI Agent 协作，
    自动完成趋势研究、受众分析、竞品调研、角度定位，
    最终输出一份完整的、可直接用于脚本创作的视频内容 Brief。

  # 触发方式
  trigger:
    type: manual
    description: "用户输入一句模糊的内容想法即可触发"
    input_schema:
      raw_idea:
        type: string
        required: true
        description: "用户的原始内容想法，可以是一句话或几个关键词"
        examples:
          - "我想做一个关于用 AI 写代码的视频"
          - "想聊聊远程办公的工具"
          - "AI agent 最近很火，想蹭一下热点"
      target_platform:
        type: string
        required: false
        default: "youtube"
        enum: ["youtube", "bilibili", "xiaohongshu", "douyin", "tiktok", "podcast"]
        description: "目标发布平台"
      language:
        type: string
        required: false
        default: "zh"
        enum: ["zh", "en", "both"]
        description: "内容语言，影响搜索范围和输出语言"
      content_pillars:
        type: array
        required: false
        description: "用户的内容支柱/频道定位（首次使用时建议填写）"
        examples:
          - ["AI 工具评测", "编程教程", "效率提升"]
      urgency:
        type: string
        required: false
        default: "normal"
        enum: ["urgent", "normal", "evergreen"]
        description: "时效性要求：urgent=热点追踪, normal=常规选题, evergreen=长青内容"

  # 数据输入源
  inputs:
    - name: brave_search
      type: api
      description: "通用网页搜索和新闻检索"
      config:
        api_key_env: BRAVE_SEARCH_API_KEY
        rate_limit: "1 req/sec"
        quota: "2000 req/month"

    - name: youtube_data
      type: api
      description: "搜索竞品视频、获取播放量和互动数据"
      config:
        api_key_env: YOUTUBE_API_KEY
        rate_limit: "10000 units/day"

    - name: reddit
      type: api
      description: "搜索相关 subreddit 的讨论和热帖"
      config:
        client_id_env: REDDIT_CLIENT_ID
        client_secret_env: REDDIT_CLIENT_SECRET
        rate_limit: "100 req/min"

    - name: twitter_x
      type: api
      description: "搜索热点话题、讨论和趋势"
      config:
        bearer_token_env: TWITTER_BEARER_TOKEN
        fallback: "scraper"
        note: "官方 API 较贵，可使用 scraper 替代"

    - name: google_trends
      type: scraper
      description: "搜索趋势分析，判断话题热度走势"
      config:
        method: "pytrends or web scraping"
        note: "无需 API key"

    - name: user_knowledge_base
      type: memory
      description: "用户的历史 Brief、频道定位、受众画像等持久化数据"
      config:
        source: "openclaw memory"

  # Agent 定义
  agents:
    - name: idea_expander
      prompt: "prompts/idea-expander.md"
      role: "创意扩展器"
      description: "把模糊想法扩展成多个搜索方向和关键词"
      input:
        - trigger.raw_idea
        - trigger.target_platform
        - trigger.language
        - trigger.content_pillars  # 优先使用用户本次输入的 content_pillars
        - memory.content_pillars   # 回退到记忆中的 content_pillars（trigger 优先，memory 补充）
      output:
        search_queries:
          type: array
          min_items: 5
          max_items: 10
          description: "多角度搜索查询列表"
        keywords:
          type: array
          description: "相关关键词和长尾词"
        angle_suggestions:
          type: array
          description: "潜在的内容角度建议"
      timeout: 30s

    - name: trend_researcher
      prompt: "prompts/trend-researcher.md"
      role: "趋势研究员"
      description: "从多平台搜索热点、竞品内容、讨论趋势"
      depends_on:
        - idea_expander
      input:
        - idea_expander.search_queries
        - idea_expander.keywords
        - inputs.brave_search
        - inputs.youtube_data
        - inputs.reddit
        - inputs.twitter_x
        - inputs.google_trends
      output:
        trend_data:
          type: object
          description: "各平台的趋势数据和 engagement 指标"
        competing_content:
          type: array
          description: "Top 竞品内容列表（含数据）"
        discussion_themes:
          type: array
          description: "社区讨论的核心主题"
        timing_assessment:
          type: object
          description: "时效性评估：是否是好时机"
      timeout: 120s

    - name: audience_mapper
      prompt: "prompts/audience-mapper.md"
      role: "受众定位器"
      description: "识别目标人群画像和传播机会"
      depends_on:
        - trend_researcher
      input:
        - trend_researcher.trend_data
        - trend_researcher.discussion_themes
        - trend_researcher.competing_content
        - memory.audience_profile
      output:
        target_audience:
          type: object
          description: "目标受众画像"
        pain_points:
          type: array
          description: "受众痛点列表"
        resonance_angles:
          type: array
          description: "最能引起共鸣的角度"
        virality_potential:
          type: object
          description: "传播潜力评估"
      timeout: 60s

    - name: positioning_strategist
      prompt: "prompts/positioning-strategist.md"
      role: "定位策略师"
      description: "确定内容差异化角度、标题方向、风险评估"
      depends_on:
        - audience_mapper
        - trend_researcher
      input:
        - audience_mapper.target_audience
        - audience_mapper.pain_points
        - audience_mapper.resonance_angles
        - trend_researcher.competing_content
        - trend_researcher.timing_assessment
        - memory.past_briefs
        - memory.performance_history
      output:
        recommended_angle:
          type: string
          description: "推荐的差异化切入角度"
        title_candidates:
          type: array
          min_items: 3
          max_items: 3
          description: "3 个标题候选"
        risk_assessment:
          type: object
          description: "风险评估（话题敏感度、竞争饱和度等）"
        competition_intensity:
          type: object
          description: "竞争强度评估"
          schema:
            score:
              type: number
              min: 1
              max: 10
            reasoning: string
            market_saturation: string
      timeout: 60s

    - name: brief_writer
      prompt: "prompts/brief-writer.md"
      role: "Brief 撰写器"
      description: "汇总所有信息，输出完整可执行的内容 Brief"
      depends_on:
        - idea_expander
        - trend_researcher
        - audience_mapper
        - positioning_strategist
      input:
        - trigger.raw_idea
        - trigger.target_platform
        - trigger.language
        - idea_expander.angle_suggestions
        - trend_researcher.trend_data
        - trend_researcher.competing_content
        - trend_researcher.timing_assessment   # 时效性数据，用于填充 why_now
        - audience_mapper.target_audience
        - audience_mapper.pain_points
        - audience_mapper.virality_potential    # 传播潜力评估
        - positioning_strategist.recommended_angle
        - positioning_strategist.title_candidates
        - positioning_strategist.risk_assessment
        - positioning_strategist.competition_intensity
      output:
        video_brief:
          type: object
          format: yaml
          description: "完整的 video_brief YAML 结构"
          required_fields:
            - raw_idea
            - refined_angle
            - target_audience
            - why_now
            - competitors
            - hooks
            - titles
            - outline
            - call_to_action
            - metadata
      timeout: 90s

  # 持久化记忆
  memory:
    enabled: true
    backend: "openclaw-memory"
    state_items:
      past_briefs:
        type: array
        description: "历史生成的 Brief（用于避免重复选题、学习偏好）"
        retention: "90 days"
        max_items: 100

      audience_profile:
        type: object
        description: "用户的目标受众画像（随使用不断精化）"
        retention: "permanent"
        updatable: true

      content_pillars:
        type: array
        description: "用户的内容支柱/频道定位"
        retention: "permanent"
        updatable: true
        examples:
          - ["AI 工具评测", "编程教程", "效率提升"]

      performance_history:
        type: array
        description: "过去 Brief 对应视频的表现数据（用户手动反馈或自动追踪）"
        retention: "permanent"
        max_items: 200
        schema:
          brief_id: string
          published_date: date
          views: number
          likes: number
          comments: number
          ctr: number
          retention_rate: number
          user_rating: number

  # 输出渠道
  outputs:
    - name: markdown_file
      type: file
      format: markdown
      description: "生成 Markdown 格式的 Brief 文件"
      path: "~/video-briefs/{date}-{slug}.md"
      enabled: true

    - name: notion_page
      type: notion
      description: "将 Brief 写入 Notion 数据库"
      config:
        api_key_env: NOTION_API_KEY
        database_id_env: NOTION_BRIEFS_DB_ID
      enabled: false

    - name: telegram_message
      type: telegram
      description: "将 Brief 摘要推送到 Telegram"
      config:
        bot_token_env: TELEGRAM_BOT_TOKEN
        chat_id_env: TELEGRAM_CHAT_ID
      template: |
        📹 新 Brief 已生成！

        💡 原始想法：{raw_idea}
        🎯 精炼角度：{refined_angle}
        👥 目标受众：{target_audience.primary}

        📌 推荐标题：
        1. {titles[0]}
        2. {titles[1]}
        3. {titles[2]}

        ⏱ 时效性：{why_now.timeliness}/10
        🔥 竞争强度：{metadata.competition_intensity}/10

        完整 Brief 已保存至：{markdown_file.path}
      enabled: false

  # 质量评估
  evaluation:
    description: "Brief 完成度自动检查，所有检查通过才输出最终结果"
    checks:
      - name: has_3_titles
        description: "必须包含 3 个标题候选"
        rule: "len(brief.titles) == 3"
        severity: error

      - name: has_hook
        description: "必须包含明确的 hook（用户为什么要点开）"
        rule: "brief.hooks.primary is not empty"
        severity: error

      - name: has_outline
        description: "必须包含内容大纲（至少 3 个 section）"
        rule: "len(brief.outline) >= 3"
        severity: error

      - name: has_audience
        description: "必须包含目标受众描述"
        rule: "brief.target_audience.primary is not empty"
        severity: error

      - name: competitive_analysis_included
        description: "必须包含至少 2 个竞品分析"
        rule: "len(brief.competitors) >= 2"
        severity: warning

      - name: actionable_brief
        description: "Brief 必须可执行——大纲中每个 section 都有 key_points"
        rule: "all(section.key_points is not empty for section in brief.outline)"
        severity: error

      - name: has_why_now
        description: "必须说明为什么现在做这个选题"
        rule: "brief.why_now.trend_signal is not empty"
        severity: warning

      - name: has_cta
        description: "必须包含行动号召"
        rule: "brief.call_to_action.primary is not empty"
        severity: warning

  # 运行配置
  settings:
    max_total_runtime: 300s
    retry_on_failure: true
    max_retries: 2
    log_level: info
    parallel_research: true  # Agent 2 的多平台搜索可并行
