workflow:
  name: video-idea-pipeline
  version: "0.2.0"
  goal: "把模糊创意自动变成可执行内容 Brief（零 API 密钥）"
  description: >
    接收用户的一句模糊内容想法，通过 5 个 AI Agent 协作，
    自动完成趋势研究、受众分析、竞品调研、角度定位，
    最终输出一份完整的、可直接用于脚本创作的视频内容 Brief。
    所有数据研究通过 Browser Use MCP 浏览器自动化完成，无需任何 API 密钥。

  # 触发方式
  trigger:
    type: manual
    description: "用户输入一句模糊的内容想法即可触发"
    input_schema:
      raw_idea:
        type: string
        required: true
        description: "用户的原始内容想法，可以是一句话或几个关键词"
        examples:
          - "我想做一个关于用 AI 写代码的视频"
          - "想聊聊远程办公的工具"
          - "AI agent 最近很火，想蹭一下热点"
      target_platform:
        type: string
        required: false
        default: "youtube"
        enum: ["youtube", "bilibili", "xiaohongshu", "douyin", "tiktok", "podcast"]
        description: "目标发布平台"
      language:
        type: string
        required: false
        default: "zh"
        enum: ["zh", "en", "both"]
        description: "内容语言，影响搜索范围和输出语言"
      content_pillars:
        type: array
        required: false
        description: "用户的内容支柱/频道定位（首次使用时建议填写）"
        examples:
          - ["AI 工具评测", "编程教程", "效率提升"]
      urgency:
        type: string
        required: false
        default: "normal"
        enum: ["urgent", "normal", "evergreen"]
        description: "时效性要求：urgent=热点追踪, normal=常规选题, evergreen=长青内容"

  # 数据输入源
  inputs:
    - name: browser_use
      type: mcp
      provider: browser-use
      description: >
        通过 Browser Use MCP 控制真实 Chromium 浏览器，直接访问各大平台获取数据。
        可导航至 Google、YouTube、Reddit、X/Twitter、Google Trends 等任意网站，
        提取页面内容和结构化数据。无需任何 API 密钥。
      config:
        install_command: "claude mcp add browser-use -- uvx --from 'browser-use[cli]' browser-use --mcp"
        capabilities:
          - "导航到任意 URL"
          - "读取页面内容并提取结构化数据"
          - "在任意搜索引擎上搜索"
          - "浏览 YouTube、Reddit、X/Twitter、Google Trends"
          - "填写表单、点击元素、滚动页面"
        platforms:
          google_search: "google.com"
          youtube: "youtube.com/results?search_query=..."
          reddit: "reddit.com/search?q=... 或 reddit.com/r/SUBREDDIT/.rss"
          twitter_x: "x.com/search?q=..."
          google_trends: "trends.google.com/trends/explore?q=..."

  # Agent 定义
  agents:
    - name: idea_expander
      prompt: "./prompts/idea-expander.md"
      role: "创意扩展器"
      description: "把模糊想法扩展成多个搜索方向和关键词"
      inputs:
        - $trigger.raw_idea
        - $trigger.target_platform
        - $trigger.language
        - $trigger.content_pillars  # 优先使用用户本次输入的 content_pillars
        - $memory.content_pillars   # 回退到记忆中的 content_pillars（trigger 优先，memory 补充）
      output:
        search_queries:
          type: array
          min_items: 5
          max_items: 10
          description: "多角度搜索查询列表"
        keywords:
          type: array
          description: "相关关键词和长尾词"
        angle_suggestions:
          type: array
          description: "潜在的内容角度建议"
      timeout: "30s"

    - name: trend_researcher
      prompt: "./prompts/trend-researcher.md"
      role: "趋势研究员"
      description: "通过 Browser Use MCP 浏览多平台，搜索热点、竞品内容、讨论趋势"
      depends_on:
        - idea_expander
      inputs:
        - $agents.idea_expander.output.search_queries
        - $agents.idea_expander.output.keywords
        - $inputs.browser_use
      output:
        trend_data:
          type: object
          description: "各平台的趋势数据和 engagement 指标"
        competing_content:
          type: array
          description: "Top 竞品内容列表（含数据）"
        discussion_themes:
          type: array
          description: "社区讨论的核心主题"
        timing_assessment:
          type: object
          description: "时效性评估：是否是好时机"
      timeout: "180s"
      note: "浏览器自动化比 API 调用更慢，但数据更真实、更全面"

    - name: audience_mapper
      prompt: "./prompts/audience-mapper.md"
      role: "受众定位器"
      description: "识别目标人群画像和传播机会"
      depends_on:
        - trend_researcher
      inputs:
        - $agents.trend_researcher.output.trend_data
        - $agents.trend_researcher.output.discussion_themes
        - $agents.trend_researcher.output.competing_content
        - $memory.audience_profile
      output:
        target_audience:
          type: object
          description: "目标受众画像"
        pain_points:
          type: array
          description: "受众痛点列表"
        resonance_angles:
          type: array
          description: "最能引起共鸣的角度"
        virality_potential:
          type: object
          description: "传播潜力评估"
      timeout: "60s"

    - name: positioning_strategist
      prompt: "./prompts/positioning-strategist.md"
      role: "定位策略师"
      description: "确定内容差异化角度、标题方向、风险评估"
      depends_on:
        - audience_mapper
        - trend_researcher
      inputs:
        - $agents.audience_mapper.output.target_audience
        - $agents.audience_mapper.output.pain_points
        - $agents.audience_mapper.output.resonance_angles
        - $agents.trend_researcher.output.competing_content
        - $agents.trend_researcher.output.timing_assessment
        - $memory.past_briefs
        - $memory.performance_history
      output:
        recommended_angle:
          type: string
          description: "推荐的差异化切入角度"
        title_candidates:
          type: array
          min_items: 3
          max_items: 3
          description: "3 个标题候选"
        risk_assessment:
          type: object
          description: "风险评估（话题敏感度、竞争饱和度等）"
        competition_intensity:
          type: object
          description: "竞争强度评估"
          schema:
            score:
              type: number
              min: 1
              max: 10
            reasoning: string
            market_saturation: string
      timeout: "60s"

    - name: brief_writer
      prompt: "./prompts/brief-writer.md"
      role: "Brief 撰写器"
      description: "汇总所有信息，输出完整可执行的内容 Brief"
      depends_on:
        - idea_expander
        - trend_researcher
        - audience_mapper
        - positioning_strategist
      inputs:
        - $trigger.raw_idea
        - $trigger.target_platform
        - $trigger.language
        - $agents.idea_expander.output.angle_suggestions
        - $agents.trend_researcher.output.trend_data
        - $agents.trend_researcher.output.competing_content
        - $agents.trend_researcher.output.timing_assessment   # 时效性数据，用于填充 why_now
        - $agents.audience_mapper.output.target_audience
        - $agents.audience_mapper.output.pain_points
        - $agents.audience_mapper.output.virality_potential    # 传播潜力评估
        - $agents.positioning_strategist.output.recommended_angle
        - $agents.positioning_strategist.output.title_candidates
        - $agents.positioning_strategist.output.risk_assessment
        - $agents.positioning_strategist.output.competition_intensity
      output:
        video_brief:
          type: object
          format: yaml
          description: "完整的 video_brief YAML 结构"
          required_fields:
            - raw_idea
            - refined_angle
            - target_audience
            - why_now
            - competitors
            - hooks
            - titles
            - outline
            - call_to_action
            - metadata
      timeout: "90s"

  # 持久化记忆
  memory:
    enabled: true
    store: "openclaw.memory.video-idea-pipeline"
    state_items:
      - key: past_briefs
        type: array
        description: "历史生成的 Brief"
        retention: "90 days"
        max_items: 100
      - key: audience_profile
        type: object
        description: "用户的目标受众画像"
        retention: "permanent"
        updatable: true
      - key: content_pillars
        type: array
        description: "用户的内容支柱/频道定位"
        retention: "permanent"
        updatable: true
      - key: performance_history
        type: array
        description: "过去 Brief 对应视频的表现数据"
        retention: "permanent"
        max_items: 200

  # 错误处理
  error_handling:
    on_browser_failure:
      strategy: partial_delivery
      description: "如果某个平台的浏览器访问失败（如反爬、超时），继续用其他平台的结果输出"
    on_agent_timeout:
      strategy: skip_with_notice
      description: "Agent 超时时跳过该步骤，注明数据暂缺"
    retry:
      max_attempts: 2
      delay: "10s"

  # 输出渠道
  outputs:
    - name: markdown_file
      type: file
      format: markdown
      description: "生成 Markdown 格式的 Brief 文件"
      path: "~/video-briefs/{date}-{slug}.md"
      enabled: true

  # 质量评估
  evaluation:
    description: "Brief 完成度自动检查，所有检查通过才输出最终结果"
    checks:
      - name: has_3_titles
        description: "必须包含 3 个标题候选"
        severity: error

      - name: has_hook
        description: "必须包含明确的 hook（用户为什么要点开）"
        severity: error

      - name: has_outline
        description: "必须包含内容大纲（至少 3 个 section）"
        severity: error

      - name: has_audience
        description: "必须包含目标受众描述"
        severity: error

      - name: competitive_analysis_included
        description: "必须包含至少 2 个竞品分析"
        severity: warning

      - name: actionable_brief
        description: "Brief 必须可执行——大纲中每个 section 都有 key_points"
        severity: error

      - name: has_why_now
        description: "必须说明为什么现在做这个选题"
        severity: warning

      - name: has_cta
        description: "必须包含行动号召"
        severity: warning

  # 运行配置
  settings:
    max_total_runtime: "600s"  # 浏览器自动化需要更多时间
    retry_on_failure: true
    max_retries: 2
    log_level: info
    parallel_research: true  # Agent 2 的多平台浏览可并行
