workflow:
  name: daily-briefing
  version: "1.0.0"
  goal: "把用户每天最重要的信息压缩成一条可执行晨报"
  description: >
    每天早上自动聚合日历、待办、邮件等信息源，
    经过 AI 智能筛选和优先级排序后，
    生成一份 30 秒内可读完的晨间简报。

  trigger:
    type: schedule
    schedule: "0 9 * * *"  # 每天早上 9:00 (cron 格式)
    timezone: "Pacific/Auckland"
    manual: true  # 支持手动触发：openclaw run daily-briefing

  inputs:
    - name: google_calendar
      type: api
      provider: google
      scope: "https://www.googleapis.com/auth/calendar.readonly"
      description: "读取今日和明天上午的日历事件"
      required: true

    - name: gmail
      type: api
      provider: google
      scope: "https://www.googleapis.com/auth/gmail.readonly"
      description: "读取过去 24 小时的星标邮件和重要未读"
      required: true

    - name: todoist
      type: api
      provider: todoist
      description: "读取今日到期和 overdue 的任务"
      required: false  # 与 notion / local_todos 三选一

    - name: notion
      type: api
      provider: notion
      description: "读取 Notion 数据库中的待办事项"
      required: false  # 与 todoist / local_todos 三选一

    - name: local_todos
      type: file
      path: "~/todos/*.md"
      description: "读取本地 Markdown 格式的待办事项"
      required: false  # 与 todoist / notion 三选一

  agents:
    - name: calendar-reader
      prompt: "./prompts/calendar-reader.md"
      description: "读取今日会议、识别冲突、找出空档时间"
      inputs:
        - google_calendar
      timeout: "30s"
      parallel_group: data_collection  # 与其他数据收集 Agent 并行

    - name: task-prioritizer
      prompt: "./prompts/task-prioritizer.md"
      description: "读取待办事项并按优先级智能排序"
      inputs:
        - todoist
        - notion
        - local_todos
      timeout: "30s"
      parallel_group: data_collection

    - name: signal-collector
      prompt: "./prompts/signal-collector.md"
      description: "收集重要通知、未读重点、客户动态"
      inputs:
        - gmail
      timeout: "30s"
      parallel_group: data_collection

    - name: executive-summarizer
      prompt: "./prompts/executive-summarizer.md"
      description: "将所有信息压缩成一条 30 秒可读的今日作战板"
      inputs:
        - "$agents.calendar-reader.output"
        - "$agents.task-prioritizer.output"
        - "$agents.signal-collector.output"
      depends_on:
        - calendar-reader
        - task-prioritizer
        - signal-collector
      timeout: "60s"

    - name: delivery-agent
      prompt: "./prompts/delivery-agent.md"
      description: "按用户配置的渠道推送晨报"
      inputs:
        - "$agents.executive-summarizer.output"
      depends_on:
        - executive-summarizer
      timeout: "30s"

  memory:
    enabled: true
    store: "openclaw.memory.daily-briefing"
    state_items:
      - key: last_run_time
        type: datetime
        description: "上次成功执行的时间，用于避免重复推送"

      - key: processed_email_ids
        type: list
        description: "已处理的邮件 ID 列表，避免重复提醒"
        max_items: 500
        ttl: "7d"  # 7 天后自动清理

      - key: user_preferences
        type: object
        description: >
          用户偏好设置：优先级权重、关注的发件人、
          忽略的日历类别、首选推送渠道等
        default:
          max_priorities: 3
          email_lookback_hours: 24
          ignored_calendar_categories: ["holidays", "birthdays"]
          important_senders: []

      - key: priority_history
        type: list
        description: >
          历史优先级记录，用于学习用户的优先级偏好。
          记录用户对晨报内容的反馈（点击/忽略/标记重要）
        max_items: 1000
        ttl: "90d"

  outputs:
    - name: telegram
      type: message
      provider: telegram
      enabled: true
      format: markdown
      config:
        bot_token: "$secrets.TELEGRAM_BOT_TOKEN"
        chat_id: "$secrets.TELEGRAM_CHAT_ID"

    - name: email
      type: email
      provider: gmail
      enabled: false  # 默认关闭，用户可手动开启
      format: html
      config:
        to: "$user.email"
        subject: "☀️ 晨间简报 — {{date}}"

    - name: markdown
      type: file
      enabled: true
      format: markdown
      config:
        path: "~/daily-briefs/{{date}}.md"
        create_dir: true

  evaluation:
    checks:
      - name: no_duplicate_items
        description: "确保同一事项不会在多个板块中重复出现"
        severity: error

      - name: actionable_output
        description: "每个 top_priority 必须包含可执行的动作描述，而非模糊的状态描述"
        severity: warning

      - name: priority_sorted
        description: "top_priorities 必须按紧急程度降序排列"
        severity: error

      - name: max_read_time_30s
        description: "整份晨报的字数不超过 500 字（中文），确保 30 秒内可读完"
        severity: warning
        config:
          max_chars: 500
          language: zh

      - name: data_freshness
        description: "所有数据必须是最近 24 小时内的，不输出过期信息"
        severity: error

  error_handling:
    on_api_failure:
      strategy: partial_delivery
      description: >
        如果某个 API 调用失败（如 Google Calendar 超时），
        不阻塞整个流程，而是在晨报中标注"日历数据暂时不可用"，
        继续输出其他板块的内容。
    on_agent_timeout:
      strategy: skip_with_notice
      description: "Agent 超时时跳过该板块，在输出中注明"
    retry:
      max_attempts: 2
      delay: 10s
