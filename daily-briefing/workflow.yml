workflow:
  name: daily-briefing
  version: "2.0.0"
  goal: "把用户每天最重要的信息压缩成一条可执行晨报"
  description: >
    零 API 密钥、零配置的本地晨间简报系统。
    使用 icalBuddy 读取日历、本地 Markdown 管理待办、
    RSS 订阅聚合新闻信号、curl 获取天气，
    经过 AI 智能筛选和优先级排序后，
    生成一份 30 秒内可读完的晨间简报。

  trigger:
    type: schedule
    schedule: "0 9 * * *"  # 每天早上 9:00 (cron 格式)
    timezone: "Pacific/Auckland"
    manual: true  # 支持手动触发：openclaw run daily-briefing

  inputs:
    - name: icalbuddy
      type: local_tool
      command: "icalBuddy"
      install: "brew install ical-buddy"
      description: "通过 icalBuddy 读取 macOS 原生日历中的今日和明天上午事件"
      required: true

    - name: local_todos
      type: file
      path: "~/todos/*.md"
      description: "读取本地 Markdown 格式的待办事项"
      required: true

    - name: rss_feeds
      type: rss
      config_path: "~/daily-briefing-config/feeds.yml"
      description: "通过 RSS 订阅聚合新闻和行业信号"
      required: false

    - name: weather
      type: http
      url: "https://wttr.in/Auckland?format=%C+%t+%w+%h"
      description: "通过 wttr.in 获取当地天气（免费、无需认证）"
      required: false

    - name: browser_use
      type: mcp
      provider: browser-use
      description: "（可选）通过 Browser Use MCP 浏览器自动化读取 Gmail 等网页数据"
      required: false

  agents:
    - name: calendar-reader
      prompt: "./prompts/calendar-reader.md"
      description: "通过 icalBuddy 读取今日会议、识别冲突、找出空档时间"
      inputs:
        - icalbuddy
      timeout: "30s"
      parallel_group: data_collection  # 与其他数据收集 Agent 并行

    - name: task-prioritizer
      prompt: "./prompts/task-prioritizer.md"
      description: "读取本地 Markdown 待办事项并按优先级智能排序"
      inputs:
        - local_todos
      timeout: "30s"
      parallel_group: data_collection

    - name: signal-collector
      prompt: "./prompts/signal-collector.md"
      description: "通过 RSS 和可选浏览器自动化收集重要信号"
      inputs:
        - rss_feeds
        - browser_use
        - weather
      timeout: "60s"
      parallel_group: data_collection

    - name: executive-summarizer
      prompt: "./prompts/executive-summarizer.md"
      description: "将所有信息压缩成一条 30 秒可读的今日作战板（含天气）"
      inputs:
        - "$agents.calendar-reader.output"
        - "$agents.task-prioritizer.output"
        - "$agents.signal-collector.output"
      depends_on:
        - calendar-reader
        - task-prioritizer
        - signal-collector
      timeout: "60s"

    - name: delivery-agent
      prompt: "./prompts/delivery-agent.md"
      description: "生成 Markdown 晨报文件并保存到本地"
      inputs:
        - "$agents.executive-summarizer.output"
      depends_on:
        - executive-summarizer
      timeout: "30s"

  memory:
    enabled: true
    store: "openclaw.memory.daily-briefing"
    state_items:
      - key: last_run_time
        type: datetime
        description: "上次成功执行的时间，用于避免重复生成"

      - key: user_preferences
        type: object
        description: >
          用户偏好设置：优先级权重、关注的 RSS 源、
          忽略的日历类别等
        default:
          max_priorities: 3
          ignored_calendar_categories: ["holidays", "birthdays"]
          rss_keywords: []

      - key: priority_history
        type: list
        description: >
          历史优先级记录，用于学习用户的优先级偏好。
          记录用户对晨报内容的反馈（点击/忽略/标记重要）
        max_items: 1000
        ttl: "90d"

  outputs:
    - name: markdown
      type: file
      enabled: true
      format: markdown
      config:
        path: "~/daily-briefs/{{date}}.md"
        create_dir: true

  evaluation:
    checks:
      - name: no_duplicate_items
        description: "确保同一事项不会在多个板块中重复出现"
        severity: error

      - name: actionable_output
        description: "每个 top_priority 必须包含可执行的动作描述，而非模糊的状态描述"
        severity: warning

      - name: priority_sorted
        description: "top_priorities 必须按紧急程度降序排列"
        severity: error

      - name: max_read_time_30s
        description: "整份晨报的字数不超过 500 字（中文），确保 30 秒内可读完"
        severity: warning
        config:
          max_chars: 500
          language: zh

      - name: data_freshness
        description: "所有数据必须是最近 24 小时内的，不输出过期信息"
        severity: error

  error_handling:
    on_tool_failure:
      strategy: partial_delivery
      description: >
        如果某个本地工具调用失败（如 icalBuddy 未安装），
        不阻塞整个流程，而是在晨报中标注"日历数据暂时不可用"，
        继续输出其他板块的内容。
    on_agent_timeout:
      strategy: skip_with_notice
      description: "Agent 超时时跳过该板块，在输出中注明"
    retry:
      max_attempts: 2
      delay: "10s"
